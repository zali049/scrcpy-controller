name: scrcpy_gui_controller
description: "A lightweight, cross-platform Scrcpy Controller for macOS,
  Windows, and Linux."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  icons_launcher: ^3.1.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  rename_app: ^1.6.6

flutter:
  uses-material-design: true
  assets:
    - assets/bin/macos/
    - assets/bin/windows/
    - assets/bin/linux/