name: scrcpy_gui_controller
description: "A lightweight, cross-platform Scrcpy Controller for macOS, Windows, and Linux."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/bin/macos/
    - assets/bin/windows/
    - assets/bin/linux/
